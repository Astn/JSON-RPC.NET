<svg xmlns="http://www.w3.org/2000/svg" width="940" height="362" viewBox="0 0 940 362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" data-revision="a4f53e6a848f">
<title>JSON-RPC.Net by transport</title><desc>AustinHarris.JsonRpc.AspNetCore on Kestrel, loopback, 16 clients on the server's 8 cores, two 3 s runs. HTTP clients await one POST at a time; TCP keeps 256 requests in flight per connection. Data revision a4f53e6a848f.</desc>
