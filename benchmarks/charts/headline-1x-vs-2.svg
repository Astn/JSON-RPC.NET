<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" data-revision="eacac12e8d55">
<title>JSON-RPC.Net 1.2.3 and 2.0 on one machine</title><desc>The same five requests on one machine in one session, 2026-09-25: Ryzen 7 7800X3D, .NET 10, Server GC, idle box. String rows: the best batch size of the thread-pool loop. Byte rows: 16 dedicated threads or 16 awaited workers in a loop. Data revision eacac12e8d55.</desc>
<rect width="940" height="420" rx="10" fill="#ffffff" stroke="#d1d5db"/>
<text x="24.0" y="32.0" text-anchor="start" font-size="18" fill="#1f2328" font-weight="600">JSON-RPC.Net 1.2.3 and 2.0 on one machine</text>
<text x="24.0" y="54.0" text-anchor="start" font-size="12" fill="#57606a">The same five requests on one machine in one session, 2026-09-25: Ryzen 7 7800X3D, .NET 10, Server GC, idle box.</text>
<text x="24.0" y="70.0" text-anchor="start" font-size="12" fill="#57606a">String rows: the best batch size of the thread-pool loop. Byte rows: 16 dedicated threads or 16 awaited workers in a loop.</text>
<line x1="330.0" y1="96" x2="330.0" y2="378" stroke="#e5e7eb"/>
<text x="330.0" y="394.0" text-anchor="middle" font-size="11" fill="#57606a">0</text>
<line x1="447.1" y1="96" x2="447.1" y2="378" stroke="#e5e7eb"/>
<text x="447.1" y="394.0" text-anchor="middle" font-size="11" fill="#57606a">10 M</text>
<line x1="564.3" y1="96" x2="564.3" y2="378" stroke="#e5e7eb"/>
<text x="564.3" y="394.0" text-anchor="middle" font-size="11" fill="#57606a">20 M</text>
<line x1="681.4" y1="96" x2="681.4" y2="378" stroke="#e5e7eb"/>
<text x="681.4" y="394.0" text-anchor="middle" font-size="11" fill="#57606a">30 M</text>
<text x="740.0" y="410.0" text-anchor="end" font-size="11" fill="#57606a">requests per second, linear scale</text>
<text x="24.0" y="116.0" text-anchor="start" font-size="12" fill="#1f2328" font-weight="600">1.2.3, the last 1.x release on NuGet</text>
<text x="316.0" y="152.0" text-anchor="end" font-size="13" fill="#1f2328">Task&lt;string&gt; Process(string), thread pool</text>
<text x="316.0" y="166.0" text-anchor="end" font-size="10" fill="#57606a">best batch size, 1,200; Json.NET on every request</text>
<rect x="330" y="139.0" width="36.1" height="18" rx="3" fill="#767676"/>
<text x="758.0" y="152.0" text-anchor="start" font-size="13" fill="#1f2328" font-weight="600">3.08 M</text>
<text x="24.0" y="190.0" text-anchor="start" font-size="12" fill="#1f2328" font-weight="600">2.0, the same string API and the same loop</text>
<text x="316.0" y="226.0" text-anchor="end" font-size="13" fill="#1f2328">Task&lt;string&gt; Process(string), thread pool</text>
<text x="316.0" y="240.0" text-anchor="end" font-size="10" fill="#57606a">best batch size, 36,000; the 1.x overloads, kept for compatibility</text>
<rect x="330" y="213.0" width="155.8" height="18" rx="3" fill="#009e73"/>
<text x="758.0" y="226.0" text-anchor="start" font-size="13" fill="#1f2328" font-weight="600">13.3 M</text>
<text x="758.0" y="240.0" text-anchor="start" font-size="10" fill="#57606a">4.3× the first row</text>
<text x="24.0" y="264.0" text-anchor="start" font-size="12" fill="#1f2328" font-weight="600">2.0, the byte entry points</text>
<text x="316.0" y="300.0" text-anchor="end" font-size="13" fill="#1f2328">Process(bytes), 16 dedicated threads</text>
<text x="316.0" y="314.0" text-anchor="end" font-size="10" fill="#57606a">the library alone; 0 B per numeric request</text>
<rect x="330" y="287.0" width="371.3" height="18" rx="3" fill="#009e73"/>
<text x="758.0" y="300.0" text-anchor="start" font-size="13" fill="#1f2328" font-weight="600">31.7 M</text>
<text x="758.0" y="314.0" text-anchor="start" font-size="10" fill="#57606a">10.3× the first row</text>
<text x="316.0" y="344.0" text-anchor="end" font-size="13" fill="#1f2328">ProcessAsync(bytes), 16 awaited workers</text>
<text x="316.0" y="358.0" text-anchor="end" font-size="10" fill="#57606a">ValueTask&lt;T&gt; methods, RpcContextFlow.None; 6 B per request</text>
