<title>JSON-RPC.Net vs StreamJsonRpc vs gRPC for .NET, 32 connections</title><desc>Same five calls, same Kestrel, 32 connections or channels with 256 requests in flight each, two 3 s runs. Every request carries &quot;jsonrpc&quot;:&quot;2.0&quot; (StreamJsonRpc requires it). Intervals span the runs; a dot is a single value. Data revision 697798ae199d.</desc>
