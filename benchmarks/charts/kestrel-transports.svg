<title>JSON-RPC.Net by transport</title><desc>AustinHarris.JsonRpc.AspNetCore on Kestrel, loopback, 32 clients on the server's 32 cores; 3 s runs, intervals span them. HTTP clients await one POST at a time; TCP keeps 256 requests in flight per connection. Data revision 697798ae199d.</desc>
