<text x="688.1" y="470.0" text-anchor="middle" font-size="10" fill="#9da7b3">20 M</text>
<line x1="750.0" y1="96" x2="750.0" y2="454" stroke="#21262d" stroke-width="0.6"/>
<text x="750.0" y="470.0" text-anchor="middle" font-size="10" fill="#9da7b3">50 M</text>
<text x="750.0" y="486.0" text-anchor="end" font-size="11" fill="#9da7b3">requests per second, log scale</text>
<text x="24.0" y="116.0" text-anchor="start" font-size="12" fill="#f0f6fc" font-weight="600">EnableAsyncMethods = false (the default)</text>
<text x="316.0" y="150.0" text-anchor="end" font-size="13" fill="#f0f6fc">HTTP, 1 request per POST</text>
<text x="316.0" y="164.0" text-anchor="end" font-size="10" fill="#9da7b3">each client awaits one POST at a time; 88 to 130 µs per round trip</text>
<line x1="344.0" y1="146.0" x2="370.5" y2="146.0" stroke="#009e73" stroke-width="3"/>
<line x1="344.0" y1="140.0" x2="344.0" y2="152.0" stroke="#009e73" stroke-width="3"/>
<line x1="370.5" y1="140.0" x2="370.5" y2="152.0" stroke="#009e73" stroke-width="3"/>
<text x="768.0" y="150.0" text-anchor="start" font-size="13" fill="#f0f6fc" font-weight="600">123 k to 182 k</text>
<text x="316.0" y="190.0" text-anchor="end" font-size="13" fill="#f0f6fc">HTTP, batch of 100 per POST</text>
<text x="316.0" y="204.0" text-anchor="end" font-size="10" fill="#9da7b3">one POST outstanding per client, 100 RPCs in it</text>
<line x1="657.9" y1="186.0" x2="666.3" y2="186.0" stroke="#009e73" stroke-width="3"/>
<line x1="657.9" y1="180.0" x2="657.9" y2="192.0" stroke="#009e73" stroke-width="3"/>
