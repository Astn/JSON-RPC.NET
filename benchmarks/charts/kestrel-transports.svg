<text x="24.0" y="54.0" text-anchor="start" font-size="12" fill="#57606a">AustinHarris.JsonRpc.AspNetCore on Kestrel, loopback, 16 clients on the server's 8 cores, two 3 s runs.</text>
<text x="24.0" y="70.0" text-anchor="start" font-size="12" fill="#57606a">HTTP clients await one POST at a time; TCP keeps 256 requests in flight per connection.</text>
