<svg xmlns="http://www.w3.org/2000/svg" width="940" height="496" viewBox="0 0 940 496" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" data-revision="eacac12e8d55">
<title>JSON-RPC.Net by transport</title><desc>AustinHarris.JsonRpc.AspNetCore on Kestrel, loopback, 16 clients on the server's 8 cores; three 3 s runs, two for the async rows. HTTP clients await one POST at a time; TCP keeps 256 requests in flight per connection. Data revision eacac12e8d55.</desc>
<rect width="940" height="496" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="24.0" y="32.0" text-anchor="start" font-size="18" fill="#f0f6fc" font-weight="600">JSON-RPC.Net by transport</text>
<text x="24.0" y="54.0" text-anchor="start" font-size="12" fill="#9da7b3">AustinHarris.JsonRpc.AspNetCore on Kestrel, loopback, 16 clients on the server's 8 cores; three 3 s runs, two for the async rows.</text>
<text x="24.0" y="70.0" text-anchor="start" font-size="12" fill="#9da7b3">HTTP clients await one POST at a time; TCP keeps 256 requests in flight per connection.</text>
