<text x="768.0" y="150.0" text-anchor="start" font-size="13" fill="#f0f6fc" font-weight="600">128 k to 168 k</text>
<text x="316.0" y="190.0" text-anchor="end" font-size="13" fill="#f0f6fc">HTTP, batch of 100 per POST</text>
<text x="316.0" y="204.0" text-anchor="end" font-size="10" fill="#9da7b3">one POST outstanding per client, 100 RPCs in it</text>
<line x1="657.4" y1="186.0" x2="662.5" y2="186.0" stroke="#009e73" stroke-width="3"/>
<line x1="657.4" y1="180.0" x2="657.4" y2="192.0" stroke="#009e73" stroke-width="3"/>
