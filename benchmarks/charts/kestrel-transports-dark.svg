<text x="532.5" y="470.0" text-anchor="middle" font-size="10" fill="#9da7b3">2 M</text>
<line x1="594.4" y1="96" x2="594.4" y2="454" stroke="#21262d" stroke-width="0.6"/>
<text x="594.4" y="470.0" text-anchor="middle" font-size="10" fill="#9da7b3">5 M</text>
<line x1="641.2" y1="96" x2="641.2" y2="454" stroke="#21262d" stroke-width="1"/>
<text x="641.2" y="470.0" text-anchor="middle" font-size="11" fill="#9da7b3">10 M</text>
