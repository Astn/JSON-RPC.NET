<text x="768.0" y="230.0" text-anchor="start" font-size="13" fill="#f0f6fc" font-weight="600">14.3 M to 16.5 M</text>
<text x="24.0" y="266.0" text-anchor="start" font-size="12" fill="#f0f6fc" font-weight="600">EnableAsyncMethods = true: every document through ProcessAsync</text>
<text x="316.0" y="300.0" text-anchor="end" font-size="13" fill="#f0f6fc">TCP, 256 pipelined, methods that complete inline</text>
<text x="316.0" y="314.0" text-anchor="end" font-size="10" fill="#9da7b3">--kestrel 3 async</text>
<line x1="668.6" y1="296.0" x2="670.4" y2="296.0" stroke="#009e73" stroke-width="3"/>
<line x1="668.6" y1="290.0" x2="668.6" y2="302.0" stroke="#009e73" stroke-width="3"/>
<line x1="670.4" y1="290.0" x2="670.4" y2="302.0" stroke="#009e73" stroke-width="3"/>
<text x="768.0" y="300.0" text-anchor="start" font-size="13" fill="#f0f6fc" font-weight="600">15.0 M to 15.4 M</text>
<text x="316.0" y="340.0" text-anchor="end" font-size="13" fill="#f0f6fc">TCP, 256 pipelined, methods that suspend once</text>
<text x="316.0" y="354.0" text-anchor="end" font-size="10" fill="#9da7b3">five async Task&lt;T&gt; methods awaiting Task.Yield(); documents are sequential per connection</text>
<line x1="500.7" y1="336.0" x2="502.8" y2="336.0" stroke="#009e73" stroke-width="3"/>
<line x1="500.7" y1="330.0" x2="500.7" y2="342.0" stroke="#009e73" stroke-width="3"/>
<line x1="502.8" y1="330.0" x2="502.8" y2="342.0" stroke="#009e73" stroke-width="3"/>
<text x="768.0" y="340.0" text-anchor="start" font-size="13" fill="#f0f6fc" font-weight="600">1.25 M to 1.29 M</text>
<line x1="24" y1="368" x2="916" y2="368" stroke="#30363d"/>
<text x="24.0" y="388.0" text-anchor="start" font-size="12" fill="#f0f6fc" font-weight="600">Reference: no transport</text>
<text x="316.0" y="422.0" text-anchor="end" font-size="13" fill="#f0f6fc">in-process, 16 threads</text>
<text x="316.0" y="436.0" text-anchor="end" font-size="10" fill="#9da7b3">the same requests through the byte entry point</text>
<line x1="723.5" y1="418.0" x2="729.8" y2="418.0" stroke="#767676" stroke-width="3"/>
<line x1="723.5" y1="412.0" x2="723.5" y2="424.0" stroke="#767676" stroke-width="3"/>
