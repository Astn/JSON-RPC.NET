<text x="316.0" y="300.0" text-anchor="end" font-size="13" fill="#1f2328">TCP, 256 pipelined, methods that complete inline</text>
<text x="316.0" y="314.0" text-anchor="end" font-size="10" fill="#57606a">--kestrel 3 async</text>
